[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maf"
version = "0.1.0"
description = "Multi-agent framework coordinating ChatGPT, Gemini and Claude over an Obsidian vault"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "openai>=3.20",
    "anthropic>=1.9",
    "google-genai>=2.25",
    "mcp>=2.2",
    "pydantic>=2.13",
    "jsonschema>=4",
    "pyyaml>=6.0",
    "python-frontmatter>=1.3",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]
science = ["numpy", "scipy", "matplotlib"]

[project.scripts]
maf = "maf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
maf = ["prompts/*.md", "prompts/roles/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = '-ra --strict-markers -m "not live"'
markers = [
    "live: makes real paid API calls; never run by default (select with -m live)",
]
